# FreeSynergy.Kanidm: public default configuration (Kanidm server.toml, version 2).
# TEMPLATE: ${vault:...} placeholders are replaced from the vault (ADR 0067) when the file is rendered on the server.
# No secret value is ever stored in this repository (ADR 0054).
version = "2"

# Name and origin MUST match the DNS name; changing them later breaks passkeys and tokens (`kanidmd domain rename`).
domain = "${vault:fs/kanidm/domain}"
origin = "https://${vault:fs/kanidm/domain}"

# Behind Zentinel (the gate) on the same host: listen on the loopback, the proxy terminates the public connection.
bindaddress = "127.0.0.1:8443"
# Read-only LDAPS is off by default; enable only if a program needs it.
# ldapbindaddress = "127.0.0.1:3636"

db_path = "/srv/freesynergy/kanidm/kanidm.db"
db_fs_type = "other"

# Kanidm always speaks TLS. The key file is written by the vault to the path below; the certificate chain is public.
tls_chain = "/etc/kanidmd/tls/chain.pem"
tls_key = "${vault:fs/kanidm/tls-key#file}"

log_level = "info"

# Zentinel on the same host passes the client address in an X-Forwarded-For header.
[http_client_address_info]
x-forward-for = ["127.0.0.1"]

[online_backup]
path = "/srv/freesynergy/kanidm/backups/"
schedule = "00 22 * * *"
versions = 7
