# Build Kanidm from the commit pinned in mirror.toml, mirror its source, sign everything with the FreeSynergy release key
# (existing secrets GPG_PRIVATE_KEY / GPG_PASSPHRASE, used only by fs-release's sign-files action) and create a DRAFT release.
# Never publishes. Runs only by hand (workflow_dispatch).
# Three jobs: `build` runs foreign build code WITHOUT secrets and with read-only rights, inside an AlmaLinux 9 container pinned by digest (glibc 2.34:
# runs on Debian 12, Ubuntu 22.04, EL9 and newer) and makes the tarball AND the .deb; `smoke` installs the .deb on Debian 12, Ubuntu 22.04 and 24.04
# (no secrets, read-only); `sign` has the secrets and the write rights but runs no foreign code, only fs-release actions pinned by commit SHA and the
# checked-in verify script.
name: mirror
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also create the DRAFT GitHub release (never public; a person publishes it)"
        type: boolean
        default: false
      build_only:
        description: "Test build: no signing, no release, artifact upload only (for CI checks before the signing secrets are set)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pin from mirror.toml
        id: pin
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib
          m = tomllib.load(open("mirror.toml", "rb"))
          print("repository=" + m["source"]["repository"]); print("tag=" + m["source"]["tag"])
          print("commit=" + m["source"]["commit"]); print("version=" + m["upstream"]["version"])
          print("profile=" + m["build"]["profile"]); print("container=" + m["build"]["container"])
          print("rust_version=" + m["build"]["rust_version"]); print("rustup_version=" + m["build"]["rustup_version"]); print("rustup_init_sha256=" + m["build"]["rustup_init_sha256"])
          print("cargo_deb_version=" + m["build"]["cargo_deb_version"]); print("cargo_deb_sha256=" + m["build"]["cargo_deb_sha256"])
          print("deb_version=" + m["upstream"]["version"] + "-" + str(m["build"]["deb_revision"]))
          PY
      - name: Upstream tag must still resolve to the pinned commit
        env:
          REPO: ${{ steps.pin.outputs.repository }}
          TAG: ${{ steps.pin.outputs.tag }}
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          got=$(git ls-remote "$REPO" "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk 'END{print $1}')
          echo "upstream $TAG -> $got (pinned $COMMIT)"
          test "$got" = "$COMMIT"
      - name: Fetch exactly the pinned commit
        env:
          REPO: ${{ steps.pin.outputs.repository }}
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          git init -q src && cd src
          git remote add origin "$REPO"
          git fetch -q --depth 1 origin "$COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: "Source tarball and licence (MPL-2.0, the source travels with the binary)"
        env:
          V: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git -C src archive --format=tar --prefix="kanidm-$V/" HEAD | gzip -n > "dist/kanidm-$V-source.tar.gz"
          cp src/LICENSE.md dist/LICENSE-MPL-2.0.md
      - name: "Build in the AlmaLinux 9 container (digest-pinned), then tarball and .deb"
        env:
          IMAGE: ${{ steps.pin.outputs.container }}
          V: ${{ steps.pin.outputs.version }}
          PROFILE: ${{ steps.pin.outputs.profile }}
          COMMIT: ${{ steps.pin.outputs.commit }}
          RUST_VERSION: ${{ steps.pin.outputs.rust_version }}
          RUSTUP_VERSION: ${{ steps.pin.outputs.rustup_version }}
          RUSTUP_INIT_SHA256: ${{ steps.pin.outputs.rustup_init_sha256 }}
          CARGO_DEB_VERSION: ${{ steps.pin.outputs.cargo_deb_version }}
          CARGO_DEB_SHA256: ${{ steps.pin.outputs.cargo_deb_sha256 }}
          DEB_VERSION: ${{ steps.pin.outputs.deb_version }}
        run: |
          set -euo pipefail
          case "$IMAGE" in *@sha256:*) ;; *) echo "::error::build image is not pinned by digest"; exit 1 ;; esac
          docker run --rm -v "$PWD/src:/work/src" -v "$PWD/dist:/work/dist" -v "$PWD/scripts/build-in-container.sh:/build.sh:ro" \
            -e VERSION="$V" -e KANIDM_BUILD_PROFILE="$PROFILE" -e COMMIT="$COMMIT" -e RUST_VERSION -e RUSTUP_VERSION -e RUSTUP_INIT_SHA256 \
            -e CARGO_DEB_VERSION -e CARGO_DEB_SHA256 -e DEB_VERSION \
            -e SOURCE_DATE_EPOCH="$(git -C src log -1 --format=%ct)" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$IMAGE" bash /build.sh
      - uses: FreeSynergy/fs-release/actions/sbom@30de3cd12b89c12cfbf33cfc7bbe0ffab11d8f6c # fs-release main 30de3cd (contains sign-cleanup ef7dfa0) (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
        with:
          name: kanidm
          version: ${{ steps.pin.outputs.version }}
          working-directory: src
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanidm-unsigned
          path: dist
          retention-days: 3
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanidm-unsigned
          path: dist
      - name: "Install the .deb on Debian 12, Ubuntu 22.04 and Ubuntu 24.04 (images from mirror.toml, pinned by digest)"
        run: scripts/smoke-deb.sh dist
  sign:
    needs: [build, smoke]
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing key must be present (a mirror is never published unsigned)
        env:
          K: ${{ secrets.GPG_PRIVATE_KEY }}
        run: test -n "$K" || { echo "::error::GPG_PRIVATE_KEY is not set in this repository"; exit 1; }
      - name: Read the pin from mirror.toml
        id: pin
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib
          m = tomllib.load(open("mirror.toml", "rb"))
          print("repository=" + m["source"]["repository"]); print("tag=" + m["source"]["tag"])
          print("commit=" + m["source"]["commit"]); print("version=" + m["upstream"]["version"])
          print("profile=" + m["build"]["profile"])
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanidm-unsigned
          path: dist
      - uses: FreeSynergy/fs-release/actions/sign-files@30de3cd12b89c12cfbf33cfc7bbe0ffab11d8f6c # fs-release main 30de3cd (contains sign-cleanup ef7dfa0) (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
        with:
          mode: packages
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: FreeSynergy/fs-release/actions/checksums@30de3cd12b89c12cfbf33cfc7bbe0ffab11d8f6c # fs-release main 30de3cd (contains sign-cleanup ef7dfa0) (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
      - uses: FreeSynergy/fs-release/actions/sign-files@30de3cd12b89c12cfbf33cfc7bbe0ffab11d8f6c # fs-release main 30de3cd (contains sign-cleanup ef7dfa0) (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
        with:
          mode: detached
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Verify our signatures against the project's public key (fingerprint from mirror.toml; nothing secret is printed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/FreeSynergy/fs-release/contents/release-signing-key.asc --jq .content | base64 -d > "$RUNNER_TEMP/release-signing-key.asc"
          scripts/verify-mirror.sh dist "$RUNNER_TEMP/release-signing-key.asc"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanidm-mirror-signed
          path: dist
          retention-days: 3
      - if: ${{ inputs.draft_release }}
        uses: FreeSynergy/fs-release/actions/draft-release@30de3cd12b89c12cfbf33cfc7bbe0ffab11d8f6c # fs-release main 30de3cd (contains sign-cleanup ef7dfa0) (pinned: these actions run next to the signing key). Update: review the fs-release diff, then bump this SHA in all three mirror repos.
        with:
          tag: v${{ steps.pin.outputs.version }}
          name: Kanidm
          token: ${{ github.token }}
