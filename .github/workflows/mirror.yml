# Build Kanidm from the commit pinned in mirror.toml, mirror its source, sign everything with the FreeSynergy release key
# (existing secrets GPG_PRIVATE_KEY / GPG_PASSPHRASE, used only by fs-release's sign-files action) and create a DRAFT release.
# Never publishes. Runs only by hand (workflow_dispatch).
name: mirror
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also create the DRAFT GitHub release (never public; a person publishes it)"
        type: boolean
        default: false
      build_only:
        description: "Test build: no signing, no release, artifact upload only (for CI checks before the signing secrets are set)"
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ !inputs.build_only }}
        name: Signing key must be present (a mirror is never published unsigned)
        env:
          K: ${{ secrets.GPG_PRIVATE_KEY }}
        run: test -n "$K" || { echo "::error::GPG_PRIVATE_KEY is not set in this repository"; exit 1; }
      - name: Read the pin from mirror.toml
        id: pin
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib
          m = tomllib.load(open("mirror.toml", "rb"))
          print("repository=" + m["source"]["repository"]); print("tag=" + m["source"]["tag"])
          print("commit=" + m["source"]["commit"]); print("version=" + m["upstream"]["version"])
          print("profile=" + m["build"]["profile"])
          PY
      - name: Upstream tag must still resolve to the pinned commit
        env:
          REPO: ${{ steps.pin.outputs.repository }}
          TAG: ${{ steps.pin.outputs.tag }}
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          got=$(git ls-remote "$REPO" "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk 'END{print $1}')
          echo "upstream $TAG -> $got (pinned $COMMIT)"
          test "$got" = "$COMMIT"
      - name: Fetch exactly the pinned commit
        env:
          REPO: ${{ steps.pin.outputs.repository }}
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          git init -q src && cd src
          git remote add origin "$REPO"
          git fetch -q --depth 1 origin "$COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"
      - name: "Source tarball and licence (MPL-2.0, the source travels with the binary)"
        env:
          V: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git -C src archive --format=tar --prefix="kanidm-$V/" HEAD | gzip -n > "dist/kanidm-$V-source.tar.gz"
          cp src/LICENSE.md dist/LICENSE-MPL-2.0.md
      - name: Build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpam0g-dev libudev-dev libssl-dev libsystemd-dev pkg-config clang
      - name: Rust toolchain (as pinned by upstream rust-toolchain.toml)
        working-directory: src
        run: rustup toolchain install --profile minimal && cargo --version
      - name: Build (same targets as upstream Makefile release/*)
        working-directory: src
        env:
          KANIDM_BUILD_PROFILE: ${{ steps.pin.outputs.profile }}
        run: |
          set -euo pipefail
          cargo build --release -p kanidm_tools --bin kanidm
          cargo build --release -p daemon --bin kanidmd
          cargo build --release --bin kanidm_ssh_authorizedkeys --bin kanidm_ssh_authorizedkeys_direct
          cargo build --release -p pam_kanidm -p nss_kanidm
          cargo build --release --features unix -p kanidm_unix_int --bin kanidm_unixd --bin kanidm_unixd_tasks --bin kanidm-unix
          # Upstream's Cargo.lock at this commit is not fully current (--locked fails, as in upstream's own Makefile targets). Show what cargo changed.
          git diff --stat -- Cargo.lock
      - name: Stage and pack (reproducible tar)
        env:
          V: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          t=src/target/release; s=stage
          install -d "$s/usr/sbin" "$s/usr/bin" "$s/usr/lib/security" "$s/usr/share/kanidmd"
          install -m755 "$t/kanidmd" "$t/kanidm_unixd" "$t/kanidm_unixd_tasks" "$s/usr/sbin/"
          install -m755 "$t/kanidm" "$t/kanidm-unix" "$t/kanidm_ssh_authorizedkeys" "$t/kanidm_ssh_authorizedkeys_direct" "$s/usr/bin/"
          install -m644 "$t/libpam_kanidm.so" "$s/usr/lib/security/pam_kanidm.so"
          install -m644 "$t/libnss_kanidm.so" "$s/usr/lib/libnss_kanidm.so.2"
          cp -r src/server/core/static "$s/usr/share/kanidmd/static"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@"$(git -C src log -1 --format=%ct)" -C "$s" -czf "dist/kanidm-$V-linux-x86_64.tar.gz" .
      - uses: FreeSynergy/fs-release/actions/sbom@main
        with:
          name: kanidm
          version: ${{ steps.pin.outputs.version }}
          working-directory: src
      - if: ${{ !inputs.build_only }}
        uses: FreeSynergy/fs-release/actions/sign-files@main
        with:
          mode: packages
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: FreeSynergy/fs-release/actions/checksums@main
      - if: ${{ !inputs.build_only }}
        uses: FreeSynergy/fs-release/actions/sign-files@main
        with:
          mode: detached
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - if: ${{ !inputs.build_only }}
        name: Verify our signatures against the project's public key (fingerprint from mirror.toml; nothing secret is printed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/FreeSynergy/fs-release/contents/release-signing-key.asc --jq .content | base64 -d > "$RUNNER_TEMP/release-signing-key.asc"
          scripts/verify-mirror.sh dist "$RUNNER_TEMP/release-signing-key.asc"
      - if: ${{ !inputs.build_only }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanidm-mirror
          path: dist
      - if: ${{ !inputs.build_only && inputs.draft_release }}
        uses: FreeSynergy/fs-release/actions/draft-release@main
        with:
          tag: v${{ steps.pin.outputs.version }}
          name: Kanidm
          token: ${{ github.token }}
